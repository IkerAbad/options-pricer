name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy src/options_pricer scripts

      - name: Test
        run: pytest --cov=options_pricer --cov-branch --cov-report=term-missing

      - name: Build the figures
        run: python scripts/make_figures.py

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check the metadata
        run: twine check dist/*

      - name: Install the wheel and run the CLI
        run: |
          python -m pip install dist/*.whl
          options-pricer price --spot 100 --strike 100 --rate 0.05 --vol 0.2 --expiry 1
