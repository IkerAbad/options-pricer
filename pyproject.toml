[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "options-pricer"
version = "1.0.0"
description = "European option pricing: Black-Scholes, Monte Carlo and SVI volatility calibration"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Iker Abad" }]
keywords = [
  "black-scholes",
  "monte-carlo",
  "options",
  "quantitative-finance",
  "svi",
  "volatility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "matplotlib>=3.9",
]

[project.urls]
Homepage = "https://github.com/IkerAbad/options-pricer"
Documentation = "https://ikerabad.github.io/options-pricer/"
Repository = "https://github.com/IkerAbad/options-pricer"
Changelog = "https://github.com/IkerAbad/options-pricer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "hypothesis>=6.100",
]

[project.scripts]
options-pricer = "options_pricer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
options_pricer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["options_pricer"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
